<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2 | LevelUp Gaming</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body id="top">
  <header class="border-bottom">
    <nav class="navbar navbar-expand-md container py-3" aria-label="Main navigation">
      <a class="navbar-brand fw-bold text-success" href="../assignment-2/index.html">
        LevelUp Gaming
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavigation"
        aria-controls="mainNavigation"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav mx-auto text-center">
          <li class="nav-item">
            <a class="nav-link" href="#top">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#products">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../assignment-2/index.html">Main store</a>
          </li>
        </ul>
        <a class="nav-link text-center" href="#footer" aria-label="Cart">
          <span aria-hidden="true">🛒</span> Cart
        </a>
      </div>
    </nav>
  </header>

  <main class="container py-4 py-md-5">
    <h1 class="mb-4">Gaming products</h1>

    <section id="products" class="row g-3 g-md-4" aria-label="Product grid">
      <div class="col-12 col-md-6 col-lg-3">
        <article class="card h-100">
          <div class="ratio ratio-4x3">
            <img
              class="card-img-top object-fit-cover"
              src="https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?auto=format&fit=crop&w=700&q=85"
              alt="Black wired gaming mouse"
            >
          </div>
          <div class="card-body">
            <h2 class="h5">Gaming Mouse</h2>
            <p class="card-text">Rs. 4,500</p>
          </div>
        </article>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <article class="card h-100">
          <div class="ratio ratio-4x3">
            <img
              class="card-img-top object-fit-cover"
              src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=700&q=85"
              alt="Mechanical gaming keyboard"
            >
          </div>
          <div class="card-body">
            <h2 class="h5">Gaming Keyboard</h2>
            <p class="card-text">Rs. 12,900</p>
          </div>
        </article>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <article class="card h-100">
          <div class="ratio ratio-4x3">
            <img
              class="card-img-top object-fit-cover"
              src="https://images.unsplash.com/photo-1599669454699-248893623440?auto=format&fit=crop&w=700&q=85"
              alt="Over-ear gaming headset"
            >
          </div>
          <div class="card-body">
            <h2 class="h5">Gaming Headset</h2>
            <p class="card-text">Rs. 8,750</p>
          </div>
        </article>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <article class="card h-100">
          <div class="ratio ratio-4x3">
            <img
              class="card-img-top object-fit-cover"
              src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=700&q=85"
              alt="Wide gaming monitor"
            >
          </div>
          <div class="card-body">
            <h2 class="h5">Gaming Monitor</h2>
            <p class="card-text">Rs. 96,000</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer id="footer" class="bg-dark text-white text-center py-3">
    <p class="mb-1">Lab 2 responsive layout</p>
    <p class="mb-0">
      <a class="link-light" href="mailto:hello@levelup.example">
        hello@levelup.example
      </a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
